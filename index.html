<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IOT Solution</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;background:#f0f3f8;color:#2b3445}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(circle at 20% 20%,#1e3a8a 0,#0f172a 55%,#020617 100%);position:relative;overflow:hidden}
#login::before,#login::after{content:"";position:absolute;border-radius:50%;filter:blur(80px);opacity:.45}
#login::before{width:380px;height:380px;background:#06b6d4;top:-100px;right:-80px}
#login::after{width:420px;height:420px;background:#7c3aed;bottom:-140px;left:-100px}
.lcard{position:relative;z-index:1;display:flex;width:100%;max-width:900px;min-height:520px;border-radius:20px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.5);background:#fff}
.lleft{flex:1;padding:50px 40px;color:#fff;background:linear-gradient(160deg,#0ea5e9,#2563eb 55%,#4f46e5);
  display:flex;flex-direction:column;justify-content:center}
.logo{font-size:34px;font-weight:800;letter-spacing:4px;line-height:1.1}
.logo span{display:block;font-size:34px;color:#fde047}
.lleft p{margin-top:22px;font-size:16px;line-height:1.6;opacity:.92}
.chips{margin-top:30px;display:flex;flex-wrap:wrap;gap:8px}
.chips i{font-style:normal;font-size:12px;padding:5px 12px;border-radius:20px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3)}
.lright{flex:1;padding:50px 44px;display:flex;flex-direction:column;justify-content:center}
.lright h2{font-size:26px;color:#0f172a;margin-bottom:6px}
.lright .sub{color:#64748b;font-size:14px;margin-bottom:28px}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:600;color:#475569;margin-bottom:6px}
.field input{width:100%;padding:13px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:15px;outline:none;transition:.2s;background:#f8fafc}
.field input:focus{border-color:#2563eb;background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.btn{width:100%;padding:14px;border:0;border-radius:10px;font-size:15px;font-weight:700;letter-spacing:1px;color:#fff;cursor:pointer;
  background:linear-gradient(90deg,#2563eb,#4f46e5);transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(79,70,229,.4)}
.err{color:#dc2626;font-size:13px;margin-bottom:12px;min-height:16px}
@media(max-width:720px){.lleft{display:none}}

/* ---------- APP ---------- */
#app{display:flex;min-height:100vh}
.side{width:250px;background:linear-gradient(180deg,#0f172a,#1e293b);color:#cbd5e1;flex-shrink:0;display:flex;flex-direction:column}
.side .brand{padding:22px 20px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08)}
.side .brand b{font-size:20px;letter-spacing:3px;color:#fff;display:block}
.side .brand b span{color:#fde047}
.avatar{width:70px;height:70px;border-radius:50%;margin:18px auto 8px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:22px;color:#fff;background:linear-gradient(135deg,#06b6d4,#4f46e5);border:3px solid rgba(255,255,255,.2)}
.uname{text-align:center;color:#fff;font-weight:600;margin-bottom:14px}
.nav a{display:block;padding:13px 22px;color:#cbd5e1;text-decoration:none;font-size:14.5px;cursor:pointer;border-left:3px solid transparent}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.active{background:rgba(37,99,235,.25);border-left-color:#38bdf8;color:#fff}
.main{flex:1;min-width:0}
.top{height:62px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.top .search{color:#94a3b8;font-size:14px}
.top button{border:1px solid #e2e8f0;background:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600;color:#475569}
.top button:hover{background:#f1f5f9}
.content{padding:26px}
h1{font-size:24px;font-weight:500;color:#2563eb;margin-bottom:20px}
h1 small{font-size:15px;color:#475569}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;margin-bottom:22px}
.card{background:#fff;border-radius:10px;padding:20px;display:flex;align-items:center;gap:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.ic{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;flex-shrink:0}
.card .n{font-size:30px;font-weight:600}
.card .l{color:#64748b;font-size:14px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.panel{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden}
.panel h3{padding:16px 20px;font-size:17px;font-weight:500;border-bottom:1px solid #eef1f6}
.panel .body{padding:16px 20px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:#64748b;letter-spacing:.5px;padding:14px 20px;background:#f8fafc}
td{padding:15px 20px;border-top:1px solid #eef1f6;font-size:14.5px}
.tag{padding:3px 10px;border-radius:12px;font-size:12px;background:#dbeafe;color:#1d4ed8}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#10b981;margin-right:6px}
.sect{margin:26px 0 12px;font-size:14px;font-weight:600;color:#475569;letter-spacing:1px}
.soon{padding:60px;text-align:center;color:#94a3b8}
svg text{font-size:11px;fill:#94a3b8}
.nav a.sub{padding:11px 22px 11px 40px;font-size:13.5px;background:rgba(0,0,0,.18)}
.fm label{display:block;font-size:13px;font-weight:600;color:#2563eb;margin:16px 0 6px;letter-spacing:.3px}
.fm select,.fm input,.fm textarea{width:100%;max-width:640px;padding:12px 14px;border:1.5px solid #cbd5e1;border-radius:6px;font-size:15px;background:#fff;outline:none;font-family:inherit}
.fm select:focus,.fm input:focus,.fm textarea:focus{border-color:#2563eb}
.hint{font-weight:400;color:#94a3b8}
.btns{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.btns button,.b2{padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer;border-radius:3px}
.b1{background:#0e7fa8;color:#fff;border:1px solid #0e7fa8}
.b2{background:#fff;color:#64748b;border:1px solid #cbd5e1}
.b3{background:#fff;color:#0f766e;border:1px solid #0f766e}
.msg{margin-top:14px;font-size:14px}
.msg.ok,.msg.bad{padding:10px 14px;border-radius:6px}
.msg.ok{background:#dcfce7;color:#166534}.msg.bad{background:#fee2e2;color:#991b1b}
.note{margin-top:18px;padding:16px;max-width:640px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:8px;font-size:14px;line-height:1.6}
.note code{background:#e2e8f0;padding:1px 6px;border-radius:4px}
.mini{margin:12px 0;background:#fff;width:auto}.mini th,.mini td{padding:8px 14px;border:1px solid #e2e8f0}
.srch{width:100%;max-width:320px;padding:10px 14px;border:1.5px solid #cbd5e1;border-radius:20px;outline:none}
.tag.g{background:#dcfce7;color:#166534}.tag.r{background:#fee2e2;color:#991b1b}.tag.y{background:#fef9c3;color:#854d0e}
.del{border:0;background:#fee2e2;border-radius:4px;padding:6px 9px;cursor:pointer}
.hrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px;flex-wrap:wrap}.hrow h1{margin:0}
.addb{background:#2563eb;color:#fff;border:0;padding:10px 22px;border-radius:22px;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 4px 12px rgba(37,99,235,.35)}
.addb:hover{background:#1d4ed8}
.chips2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.th{display:flex;justify-content:space-between;align-items:center}
.ib{width:28px;height:28px;margin-left:6px;border:1px solid #fdba74;background:#fff7ed;color:#c2410c;border-radius:3px;cursor:pointer;font-size:14px}
.ib.red{border-color:#fca5a5;background:#fee2e2;color:#b91c1c}
.term{background:#2b2b2b;color:#fff;font-family:Consolas,"Courier New",monospace;font-size:13px;height:480px;overflow:auto;padding:12px 14px;line-height:1.5}
.info{margin-top:14px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:4px;padding:14px 20px}
.it{width:auto}.it td{border:0;padding:5px 14px;font-size:14px}.it td:first-child{color:#475569}
.it code{background:#dbeafe;padding:2px 8px;border-radius:4px}
.sm{padding:4px 10px!important;font-size:12px!important}

/* ---------- 3D PCB LOGIN BG ---------- */
#pcb3d{position:absolute;inset:0;z-index:0}
#pcb3d canvas{display:block;width:100%;height:100%}
#login::before,#login::after{display:none}
.lcard{background:rgba(255,255,255,.62);backdrop-filter:blur(2px);box-shadow:0 30px 80px rgba(0,0,0,.6)}
#login .lleft{background:linear-gradient(160deg,rgba(14,165,233,.78),rgba(37,99,235,.78) 55%,rgba(79,70,229,.78))}
#login .field input{background:rgba(255,255,255,.85)}
/* ---------- NEW DASHBOARD ---------- */
.hero{border-radius:14px;padding:24px 28px;color:#fff;background:linear-gradient(120deg,#0f172a,#1e3a8a 60%,#6366f1);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.hero h2{font-size:22px;font-weight:600}.hero p{opacity:.75;font-size:13.5px;margin-top:4px}
.hero .pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:6px 14px;border-radius:20px;font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:20px}
.kpi{border-radius:14px;padding:20px;color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(15,23,42,.15)}
.kpi .n{font-size:32px;font-weight:700}.kpi .n small{font-size:13px;opacity:.85;font-weight:500}.kpi .l{font-size:13px;opacity:.9;margin-top:2px}
.kpi .wm{position:absolute;right:-6px;bottom:-16px;font-size:84px;opacity:.18;line-height:1}
.hb{display:flex;align-items:center;gap:10px;margin:11px 0;font-size:13px}
.hb .nm{width:96px;color:#475569;flex-shrink:0}.hb .tr{flex:1;height:10px;background:#eef2f7;border-radius:6px;overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#06b6d4,#6366f1)}.hb b{width:26px;text-align:right;color:#334155}
.hcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.hc{background:#fff;border-radius:12px;padding:16px 18px;border-left:5px solid;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;justify-content:space-between;align-items:center}
.hc .n{font-size:26px;font-weight:700;color:#0f172a}.hc .l{font-size:13px;color:#64748b}.hc .e{font-size:26px;opacity:.85}
.fm .row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sep{margin:26px 0 0;border-top:1px dashed #cbd5e1;max-width:640px}
.tag.p{background:#ede9fe;color:#5b21b6}
.pgsel{margin-top:4px;padding:3px 4px;border:1px solid #cbd5e1;border-radius:4px;font-size:12px;background:#fff;color:#334155;cursor:pointer}
.pgbar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-top:1px solid #eef1f6;font-size:13px;color:#64748b;flex-wrap:wrap;gap:8px}
.pgbar button:disabled{opacity:.4;cursor:not-allowed}

.panel{overflow-x:auto}
#menuBtn,.ovl{display:none}
.top .lt{display:flex;align-items:center;gap:12px;min-width:0}
#fwh{overflow-x:auto}
@media(max-width:800px){
  .side{position:fixed;left:0;top:0;bottom:0;width:268px;z-index:50;transform:translateX(-100%);transition:transform .25s ease;overflow-y:auto;box-shadow:none}
  body.navopen .side{transform:none;box-shadow:6px 0 30px rgba(0,0,0,.4)}
  .ovl{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:40}
  body.navopen .ovl{display:block}
  body.navopen{overflow:hidden}
  #menuBtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;font-size:20px;line-height:1}
  .top{padding:0 14px;position:sticky;top:0;z-index:30}
  .content{padding:14px}
  h1{font-size:20px;margin-bottom:14px}
  h1 small{font-size:13px}
  .hero{padding:18px;border-radius:12px;margin-bottom:14px}
  .hero h2{font-size:18px}
  .kpis,.hcs,.cards{grid-template-columns:1fr 1fr;gap:10px}
  .kpis{margin-bottom:14px}
  .kpi{padding:14px;border-radius:12px}
  .kpi .n{font-size:24px}
  .kpi .wm{font-size:60px}
  .hc{padding:12px 14px}
  .hc .n{font-size:21px}
  .card{padding:14px;gap:12px}
  .card .n{font-size:24px}
  .ic{width:44px;height:44px;font-size:19px}
  .grid2{gap:14px}
  .hb .nm{width:72px}
  .panel h3{padding:14px 16px;font-size:16px}
  .panel .body{padding:14px 16px}
  .panel table:not(.mini):not(.it){min-width:620px}
  th,td{padding:12px 14px}
  .fm select,.fm input,.fm textarea{max-width:100%;font-size:16px}
  .btns button{flex:1 1 auto}
  .note{max-width:100%}
  .term{height:60vh}
  .srch{max-width:100%}
  .lright{padding:34px 24px}
  .lcard{min-height:0}
}
@media(max-width:380px){
  .kpis,.hcs,.cards{grid-template-columns:1fr}
}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px 24px;max-width:1000px}
.pgh{grid-column:1/-1;font-weight:700;color:#2563eb;font-size:12.5px;letter-spacing:.6px;margin-top:10px;padding-bottom:4px;border-bottom:1px solid #eef1f6}
.fm label.pg{display:flex;align-items:center;gap:9px;margin:0;font-size:14px;font-weight:400;color:#334155;letter-spacing:0;cursor:pointer}
.fm .pgrid input[type=checkbox]{width:18px;height:18px;padding:0;margin:0;flex-shrink:0}
.pgtools{display:flex;gap:8px;margin:8px 0 4px}
.cnt{display:inline-block;min-width:22px;text-align:center}
.vlogo{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(135deg,#e0f2fe,#ede9fe);border:2px solid #bfdbfe;flex-shrink:0;line-height:1}
.map{height:520px;border-radius:10px;border:1px solid #e2e8f0;position:relative;z-index:0}
.lvwrap{display:grid;grid-template-columns:310px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.lvwrap{grid-template-columns:1fr}.map{height:380px}}
.lvi{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid #eef1f6;cursor:pointer}
.lvi:hover,.lvi.sel{background:#eff6ff}
.lvi .t1{font-weight:600;font-size:14px}.lvi .t2{font-size:12px;color:#64748b}
.mk{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:#fff;border:3px solid #10b981;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.mk.off{border-color:#ef4444}
.ig{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.ig .c{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.06);border-left:4px solid #6366f1}
.ig .k{font-size:12px;color:#64748b}.ig .v{font-size:17px;font-weight:600;color:#0f172a;margin-top:2px;word-break:break-word}
.demo{display:inline-block;background:#fef9c3;color:#854d0e;border-radius:12px;padding:3px 10px;font-size:12px;margin-left:8px}
.hp{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;background:#fff;padding:12px 16px;border-radius:10px}
.hp input[type=range]{flex:1;min-width:160px}
.vpv{display:flex;align-items:center;gap:10px;margin-top:10px}

</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="login">
  <div id="pcb3d"></div>
  <div class="lcard">
    <div class="lleft">
      <div class="logo">IOT<span>SOLUTION</span></div>
      <p>Please login to access your account and manage your devices remotely.</p>
      <div class="chips"><i>GPS Tracking</i><i>Fleet Control</i><i>Remote Config</i><i>Firmware OTA</i></div>
    </div>
    <form class="lright" id="lform" autocomplete="off">
      <h2>Welcome Back</h2>
      <div class="sub">Sign in to continue to your dashboard</div>
      <div class="field"><label>Login ID</label><input id="uid" type="text" placeholder="Enter Login ID" required></div>
      <div class="field"><label>Password</label><input id="pwd" type="password" placeholder="Enter Password" required></div>
      <div class="err" id="err"></div>
      <button class="btn" type="submit">LOG IN</button>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="ovl" id="ovl"></div>
  <aside class="side">
    <div class="brand"><b>IOT <span>SOLUTION</span></b></div>
    <div class="avatar" id="av">IS</div>
    <div class="uname" id="uname">Admin</div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="main">
    <div class="top"><div class="lt"><button id="menuBtn" aria-label="Menu">☰</button><div class="search">🔍 SEARCH ...</div></div><button id="logout">Logout</button></div>
    <div class="content" id="view"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const BASE_MODELS=["PNVE","MIJO","GT06","FMB920","V5","AIS140","RFID","E-LOCK","VIDEO CAMERA"];
let MODELS=BASE_MODELS.slice();
const baseType=m=>m==="RFID"?"RFID":m==="VIDEO CAMERA"?"Camera":m==="E-LOCK"?"Lock":"GPS";
const modelType=m=>{const c=store.get("iot_models").find(x=>x.name===m);return c?c.type:baseType(m);};
function loadModels(){MODELS=BASE_MODELS.concat(store.get("iot_models").map(x=>x.name).filter(n=>!BASE_MODELS.includes(n)));}
const USER_TYPES=["Admin","Sub Admin","User"];
const myType=()=>sessionStorage.getItem("iot_type")||"Admin";
const MENU=[
 {n:"Dashboard"},{n:"Vehicle Tracking",sub:["Add Vehicle","Live Tracking","History Tracking","History Report","Vehicle On/Off Report","Vehicle Summary Report"]},{n:"Device Models"},{n:"Devices"},{n:"Production Portal"},
 {n:"Device Configuration",sub:["Change Firmware","Command List","Send Command","Send Bulk Command"]},
 {n:"Firmware Manager",sub:["Firmware Change","Upload Firmware"]},
 {n:"Remote Terminal",sub:["Session List","New Session"]},
 {n:"Repair Portal"},{n:"Logs"},{n:"Settings",sub:["Contacts/Sub-Account"]}];
const PERMS=[
 {g:"DASHBOARD",i:[["dash","View Dashboard"]]},
 {g:"VEHICLE TRACKING",i:[["veh_a","Add / View Vehicles"],["veh_live","Live Tracking"],["veh_hist","History Tracking"],["veh_rep","Vehicle Reports"]]},
 {g:"DEVICE MODELS",i:[["models_v","View Device Models"],["models_a","Add Device Models"]]},
 {g:"DEVICES",i:[["dev_v","View Devices"],["dev_a","Add Devices"]]},
 {g:"PRODUCTION PORTAL",i:[["prod","View Production Portal"]]},
 {g:"DEVICE COMMANDS",i:[["cmd_v","View Command List"],["cmd_s","Send Command to device"],["cmd_b","Send Bulk Command"]]},
 {g:"FIRMWARE MANAGER",i:[["fw_chg","Firmware Change (update device)"],["fw_up","Upload firmware versions"]]},
 {g:"REMOTE TERMINAL",i:[["term","Access & create remote terminal session"]]},
 {g:"REPAIR PORTAL",i:[["repair","View Repair Portal"]]},
 {g:"LOGS",i:[["logs","View Logs"]]}];
const ALLP=PERMS.flatMap(x=>x.i.map(y=>y[0]));
const PAGEPERM={"Dashboard":"dash","Device Models":"models_v","Add Model":"models_a","Devices":"dev_v","Add Device":"dev_a","Production Portal":"prod",
 "Change Firmware":"fw_chg","Firmware Change":"fw_chg","Firmware Manager":"fw_chg","Upload Firmware":"fw_up","Command List":"cmd_v","Send Command":"cmd_s","Send Bulk Command":"cmd_b",
 "Session List":"term","New Session":"term","Repair Portal":"repair","Logs":"logs","Add Vehicle":"veh_a","Live Tracking":"veh_live","History Tracking":"veh_hist","History Report":"veh_rep","Vehicle On/Off Report":"veh_rep","Vehicle Summary Report":"veh_rep"};
const ADMINPAGES=["Contacts/Sub-Account","Add Contact","Users","Settings"];
const can=k=>{if(myType()==="Admin")return true;const p=sessionStorage.getItem("iot_perms");if(!p||p==="null")return true;try{return JSON.parse(p).includes(k);}catch(e){return false;}};
const pageAllowed=p=>{if(ADMINPAGES.includes(p))return isMain();const k=PAGEPERM[p]||(p.startsWith("Terminal/")?"term":null);return k?can(k):true;};

/* ---------- Firmware Manager ---------- */
/* FW_CMD: device ko firmware link bhejne wali command. {url} ki jagah firmware ka link lagta hai.
   Apne device ki asli upgrade command yahan (ya Upload Firmware page par) likhein.
   FW_API.url: (optional) apni server API – blank rakhein to sirf Command List me command add hoti hai. */
const FW_CMD="UPGRADE,{url}";
const FW_API={url:""};
const FW_MAX=20*1024*1024,FW_EXT=/\.(bin|hex|zip|fw|img|rbl|s19|srec|dfu|gz)$/i;
const fwMeta=()=>store.get("iot_fwmeta");
const isUrl=u=>{try{const x=new URL(u);return x.protocol==="http:"||x.protocol==="https:";}catch(e){return false;}};
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("iot_fw_files",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const idbPut=async(k,v)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("f","readwrite");t.objectStore("f").put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});};
const idbGet=async k=>{const d=await idb();return new Promise((res,rej)=>{const q=d.transaction("f").objectStore("f").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});};
const idbDel=async k=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("f","readwrite");t.objectStore("f").delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});};
const fmtSize=n=>!n?"-":n>=1048576?(n/1048576).toFixed(2)+" MB":(n/1024).toFixed(1)+" KB";
async function sha256(buf){try{const h=await crypto.subtle.digest("SHA-256",buf);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("");}catch(e){return "-";}}

/* --- Upload Firmware --- */
function fwUp(){setTimeout(drawFwFiles,0);return `<h1>Firmware Manager <small>» Upload Firmware</small></h1>
<div class="panel"><h3>Add Firmware Version</h3><div class="body fm">
<label>Device Model</label>${typeSel("fu_type")}
<label>Firmware Version</label><input id="fu_ver" maxlength="20" placeholder="e.g. 2.0.6">
<label>Firmware Link (URL) <span class="hint">(device isi link se firmware download karega)</span></label><input id="fu_url" type="url" inputmode="url" placeholder="https://yourserver.com/firmware/GT06_v2.0.6.bin">
<label>Update Command <span class="hint">({url} ki jagah upar ka link lagega)</span></label><input id="fu_cmd" value="${esc(FW_CMD)}" placeholder="UPGRADE,{url}">
<div class="sep"></div>
<label>OR Firmware File <span class="hint">(optional – .bin, .hex, .zip, .fw, .img … max 20 MB)</span></label><input type="file" id="fu_file" accept=".bin,.hex,.zip,.fw,.img,.rbl,.s19,.srec,.dfu,.gz">
<label>Release Notes <span class="hint">(optional)</span></label><textarea id="fu_note" rows="3" placeholder="What changed in this version"></textarea>
<div class="note">Link <b>ya</b> File – kam se kam ek zaroori hai. Link dene par Firmware Change me update karte hi command <b>Command List</b> me add ho jati hai.</div>
<div id="msg" class="msg"></div>${actions("doFwUp()","SAVE")}</div></div>
<div class="panel" style="margin-top:18px"><h3>Firmware Versions</h3><div id="fwf"></div></div>`;}
async function doFwUp(){
  const t=val("fu_type"),v=val("fu_ver"),u=val("fu_url"),c=val("fu_cmd"),f=$("fu_file").files[0],n=val("fu_note");
  if(!t)return flash("Select device model",0);
  if(!/^[A-Za-z0-9._-]{1,20}$/.test(v))return flash("Enter a valid version (letters, digits, . _ -)",0);
  if(!u&&!f)return flash("Enter firmware link or choose a firmware file",0);
  if(u&&!isUrl(u))return flash("Enter a valid link starting with http:// or https://",0);
  if(u&&!c.includes("{url}"))return flash("Update Command must contain {url}",0);
  if(f){
    if(!FW_EXT.test(f.name))return flash("Unsupported file type. Use .bin, .hex, .zip, .fw, .img etc.",0);
    if(!f.size)return flash("File is empty",0);
    if(f.size>FW_MAX)return flash("File too large ("+fmtSize(f.size)+"). Max 20 MB",0);
  }
  if(fwMeta().some(x=>x.model===t&&x.ver.toLowerCase()===v.toLowerCase()))return flash("Version "+v+" already added for "+t,0);
  flash("Saving…",1);
  try{
    const id=Date.now();let hash="-";
    if(f){const buf=await f.arrayBuffer();hash=await sha256(buf);await idbPut(id,{buf});}
    const a=fwMeta();a.push({id,model:t,ver:v,url:u,cmd:u?c:"",name:f?f.name:"",size:f?f.size:0,sha:hash,note:n,by:who(),at:ts()});store.set("iot_fwmeta",a);
    flash("Firmware "+v+" saved for "+t,1);
    $("fu_ver").value="";$("fu_url").value="";$("fu_file").value="";$("fu_note").value="";drawFwFiles();
  }catch(e){flash("Save failed: browser storage error",0);}
}
function drawFwFiles(){
  const e=$("fwf");if(!e)return;const a=fwMeta().slice().reverse();
  e.innerHTML=`<table><tr><th>SR. NO.</th><th>DEVICE MODEL</th><th>VERSION</th><th>LINK / FILE</th><th>SIZE</th><th>ADDED BY</th><th>ADDED AT</th><th>ACTION</th></tr>
${a.length?a.map((x,i)=>`<tr><td>${i+1}</td><td><span class="tag">${esc(x.model)}</span></td><td><span class="tag g">${esc(x.ver)}</span></td><td style="word-break:break-all">${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.url)}</a><br><small>CMD: ${esc(x.cmd)}</small>`:""}${x.name?`${x.url?"<br>":""}📎 ${esc(x.name)}`:""}${x.note?`<br><small>${esc(x.note)}</small>`:""}</td><td>${fmtSize(x.size)}</td><td>${esc(x.by)}</td><td>${x.at}</td><td style="white-space:nowrap">${x.name?`<button class="del" style="background:#dbeafe" title="Download" onclick="dlFw(${x.id})">⬇</button> `:""}${canDel()?`<button class="del" onclick="delFw(${x.id})">🗑</button>`:""}</td></tr>`).join(""):`<tr><td colspan="8" class="soon">No firmware added yet</td></tr>`}</table>`;
}
async function dlFw(id){
  const m=fwMeta().find(x=>x.id===id),r=await idbGet(id).catch(()=>null);
  if(!m||!r)return alert("File not found in storage");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([r.buf]));a.download=m.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
async function delFw(id){
  if(!canDel())return;
  if(!confirm("Delete this firmware version?"))return;
  await idbDel(id).catch(()=>0);store.set("iot_fwmeta",fwMeta().filter(x=>x.id!==id));drawFwFiles();
}

async function doFwMgr(){
  const t=val("fm_type"),i=val("fm_imei"),id=+val("fm_ver");
  if(!t)return flash("Select device model",0);
  if(!isImei(i))return flash("Enter valid 15 digit IMEI",0);
  const er=chkDev(i,t);if(er)return flash(er,0);
  const m=fwMeta().find(x=>x.id===id);
  if(!m)return flash(fwMeta().some(x=>x.model===t)?"Select version":"No firmware added for "+t+". Add it first in Upload Firmware.",0);
  let st="Queued",msg="",cmd="";
  if(m.url){
    cmd=(m.cmd||FW_CMD).replace(/\{url\}/g,m.url);
    const c=store.get("iot_cmd");c.push(mkCmd(t,i,cmd));store.set("iot_cmd",c);
    msg="Firmware "+m.ver+" command added to Command List: "+cmd;
  }
  if(FW_API.url){
    flash("Sending to server…",1);
    try{
      const fd=new FormData();fd.append("imei",i);fd.append("model",t);fd.append("version",m.ver);

      if(m.name){const r=await idbGet(id);if(r){fd.append("sha256",m.sha);fd.append("file",new Blob([r.buf]),m.name);}}
      const res=await fetch(FW_API.url,{method:"POST",body:fd});
      if(!res.ok)throw new Error("HTTP "+res.status);
      st="Sent";msg="Firmware "+m.ver+" sent to server for "+t+" device "+i;
    }catch(e){st="Failed";msg="Server request failed: "+e.message+(m.url?" (command is still in Command List)":"");}
  }else if(!m.url){
    msg="This version has only a file – server API (FW_API.url) is not set, so it was only queued. Add a firmware link to send it from here.";
  }
  const a=store.get("iot_fw");a.push({t,v:m.ver,l:[i],file:m.url||m.name||"-",st,by:who(),at:ts()});store.set("iot_fw",a);
  flash(msg,st!=="Failed"&&(m.url||FW_API.url));$("fm_imei").value="";drawFwHist();

async function doBulk(){

async function doDevUpload(){
  const f=$("d_file").files[0],def=val("d_type"),m2=(t,ok)=>{const e=$("msg2");e.className="msg "+(ok?"ok":"bad");e.textContent=t;};
  if(!f)return m2("Choose an Excel file",0);
  let rows;
  try{
    if(/\.csv$/i.test(f.name))rows=(await f.text()).split(/\r?\n/).map(l=>l.split(","));

async function doContact(){
  const old=_edit,uid=val("c_uid"),name=val("c_name"),email=val("c_email"),pw=$("c_pw").value,pw2=$("c_pw2").value,phone=val("c_phone"),des=val("c_des"),type=$("c_type").value;
  const perms=[...document.querySelectorAll(".pm:checked")].map(c=>c.value);
  if(uid.length<3)return flash("Login ID must be at least 3 characters",0);
  if(email&&!/^\S+@\S+\.\S+$/.test(email))return flash("Enter a valid email",0);
  if(!old||pw||pw2){
    if(pw.length<6)return flash("Password must be at least 6 characters",0);
    if(pw!==pw2)return flash("Password and Confirm Password do not match",0);
  }
  if(type!=="Admin"&&!perms.length)return flash("Select at least one permission",0);
  flash("Saving…",1);
  try{
    if(!old){
      const a=await getUsers();
      if(uid.toLowerCase()==="admin"||a.some(x=>x.uid.toLowerCase()===uid.toLowerCase()))return flash("This Login ID already exists",0);
    }
    const rec=Object.assign({},old||{id:Date.now(),by:who(),at:ts()},{uid,name,email,phone,desig:des,type,perms:type==="Admin"?ALLP.slice():perms});
    if(pw){rec.ph=await hashPw(uid,pw);delete rec.pwd;}
    await saveUser(rec);
  }catch(er){return flash("Could not save: "+er.message+(CLOUD.url?" (check CLOUD.url and database rules)":""),0);}
  _edit=null;go("Contacts/Sub-Account");
}
async function delUser(id){
  if(!canDel())return;

  try{await removeUser(u);}catch(er){return alert("Could not delete: "+er.message);}
  drawUserList();
}

const RT={ip:"154.210.168.75",port:8900,ws:""}; // ws: backend WebSocket URL (e.g. "ws://yourserver:8901") – blank = demo only
function tp(t,b){const e=$("term");if(!e)return;const d=document.createElement("div");d.textContent=t;if(b)d.style.fontWeight="700";e.appendChild(d);e.scrollTop=e.scrollHeight;}
function termPage(id){
  const s=store.get("iot_sess").find(x=>String(x.id)===id);
  if(!s)return `<h1>Remote Terminal</h1><div class="panel"><div class="soon">Session not found</div></div>`;
  setTimeout(()=>termInit(s),0);
  return `<h1>Remote Terminal <small>» ${esc(s.d)}</small></h1>
<div class="panel"><h3 class="th">Remote Terminal <span><button class="ib" title="Fullscreen" onclick="termFs()">⛶</button><button class="ib" title="Back" onclick="go('Session List')">←</button><button class="ib red" title="Stop session" onclick="termStop(${s.id})">■</button></span></h3>
<div id="term" class="term"></div></div>
<div class="info"><table class="it">
<tr><td>Server IP</td><td>${RT.ip}</td></tr><tr><td>Port</td><td>${RT.port}</td></tr>
<tr><td>Command</td><td><code>rdbg=${RT.ip},${RT.port}</code> <button class="b2 sm" onclick="copyCmd()">Copy</button></td></tr>
<tr><td>Session</td><td>${esc(s.t)} · ${s.m} min · <b id="left"></b></td></tr></table>
<div class="note" style="margin-top:10px">Upar wali <b>Command</b> device ko bhejo. Device server se connect hote hi uske logs is console me aane lagenge.</div>
<div class="btns"><button class="b2" onclick="termDemo()">▶ Simulate device connect (demo)</button></div></div>`;
}
function termInit(s){
  window._cur=s;const end=s.start+s.m*60000;
  tp("IOT Solution Remote Terminal v1.0",1);tp("Waiting for device connection ...",1);
  if(s.ended||Date.now()>=end){tp("Session is no longer active.");const e=$("left");if(e)e.textContent="ended";return;}
  const tick=()=>{const l=end-Date.now(),e=$("left");if(!e)return;
    if(l<=0){e.textContent="expired";tp("Session expired.",1);clearInterval(window._tt);clearInterval(window._td);return;}
    e.textContent=Math.floor(l/60000)+"m "+pad(Math.floor(l%60000/1000))+"s left";};
  tick();window._tt=setInterval(tick,1000);
  if(RT.ws){try{const w=new WebSocket(RT.ws+"?id="+encodeURIComponent(s.d));window._ws=w;
    w.onopen=()=>tp("Connected to server");w.onmessage=m=>tp(m.data);w.onclose=()=>tp("Connection closed");}catch(e){tp("Server connection failed");}}
}
function termDemo(){
  clearInterval(window._td);const s=window._cur,L=["GSM: registered, CSQ 22","GPS: fix OK, sats 9","TCP: connected to server","FOTA Check: No Update. Current Version: 2.0.6","Packet sent, ACK received","Ignition: ON","Battery: 12.4V"];
  tp("[DEMO] Device connected: "+s.d,1);let i=0;
  window._td=setInterval(()=>{tp("[DEMO] "+ts().slice(11)+"  "+L[i++%L.length]);if(i>30)clearInterval(window._td);},1200);
}
function termStop(id){store.set("iot_sess",store.get("iot_sess").map(s=>s.id===id?Object.assign(s,{ended:Date.now()}):s));go("Session List");}
function termFs(){const e=$("term");if(e&&e.requestFullscreen)e.requestFullscreen();}
function copyCmd(){try{navigator.clipboard.writeText("rdbg="+RT.ip+","+RT.port)}catch(e){}}


/* ---------- Vehicle Tracking ---------- */
/* Live / History data source: Firebase (CLOUD.url) me  iot_live/<IMEI>  aur  iot_hist/<IMEI>  se padhta hai.
   iot_live/<IMEI> = {t:ms, lat, lng, speed, ign:true/false, power:V, batt:V, gsm:0-5, sats:n}
   iot_hist/<IMEI>/<pushid> = {t:ms, lat, lng, speed, ign, power}
   Data na milne par DEMO data dikhta hai (badge ke saath). Map: OpenStreetMap (free). */
const DEMO_NOTE="DEMO DATA – device ka live data server abhi connect nahi hai";
const VTYPES=[["2 Wheeler","🏍️"],["Scooter","🛵"],["Bicycle","🚲"],["3 Wheeler / Auto","🛺"],["E-Rickshaw","🛺"],["Car","🚗"],["Taxi / Cab","🚕"],["Jeep / SUV","🚙"],["Van / Tempo","🚐"],["Pickup / Mini Truck","🛻"],["Truck","🚚"],["Trailer / Container","🚛"],["Tanker","🚛"],["Dumper / Tipper","🚚"],["Bus","🚌"],["School Bus","🚌"],["Ambulance","🚑"],["Fire Truck","🚒"],["Police Vehicle","🚓"],["Tractor","🚜"],["JCB / Excavator","🏗️"],["Crane","🏗️"],["Garbage Truck","🚛"],["Other","📍"]];
const vIcon=t=>(VTYPES.find(x=>x[0]===t)||[0,"📍"])[1];
const vehs=()=>store.get("iot_veh");
const vLogo=(t,s)=>{s=s||40;return `<span class="vlogo" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.55)}px">${vIcon(t)}</span>`;};
const vehSel=(id,all)=>`<select id="${id}" style="max-width:420px">${all?'<option value="all">All Vehicles</option>':'<option value="">Select Vehicle</option>'}${vehs().map(v=>`<option value="${v.id}">${esc(v.name)} — ${esc(v.imei)}</option>`).join("")}</select>`;
const dtl=d=>{d=new Date(d);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes());};
const fd=ms=>{const m=Math.round(ms/60000);return Math.floor(m/60)+"h "+(m%60)+"m";};
const nz=(x,u)=>x==null||x===""?"-":x+(u||"");
const hav=(a,b)=>{const r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 12742*Math.asin(Math.sqrt(h));};
function calc(a){
  let d=0,mx=0,run=0,stop=0,on=0,ms=0,mc=0,first="-",last="-";
  for(let i=0;i<a.length;i++){const p=a[i];
    if(p.speed>mx)mx=p.speed;if(p.speed>0){ms+=p.speed;mc++;}
    if(i){const q=a[i-1],dt=Math.min(p.t-q.t,18e5);
      if(q.speed>0||p.speed>0)d+=hav(q,p);
      if(q.ign)run+=dt;else stop+=dt;
      if(!q.ign&&p.ign){on++;if(first==="-")first=ts(new Date(p.t));}
      if(q.ign&&!p.ign)last=ts(new Date(p.t));
    }else if(p.ign){on++;first=ts(new Date(p.t));}
  }
  return{d,mx,avg:mc?ms/mc:0,run,stop,on,first,last};
}
/* demo data generator (sirf tab jab server me data na ho) */
function simState(imei,t){
  let s=0;for(const ch of imei)s=(s*31+ch.charCodeAt(0))%100003;
  const bl=28.6139+(s%50)/500,bg=77.2090+(s%37)/500,k=t/600000+s;
  const ign=Math.sin(t/2400000+s)>-0.35;
  const sp=ign?Math.round(Math.max(3,25+30*Math.sin(t/180000+s)+8*Math.sin(t/37000))):0;
  return{t,lat:+(bl+0.03*Math.sin(k*0.9)+0.01*Math.sin(k*3.1)).toFixed(6),lng:+(bg+0.03*Math.cos(k*0.7)+0.01*Math.cos(k*2.3)).toFixed(6),
    speed:sp,ign,power:+(12.2+0.6*Math.sin(t/900000+s)).toFixed(1),batt:+(3.9+0.15*Math.sin(t/1800000)).toFixed(2),
    gsm:2+Math.floor(3*Math.abs(Math.sin(t/500000+s))),sats:6+Math.floor(6*Math.abs(Math.sin(t/700000+s)))};
}
async function getLive(v){
  if(CLOUD.url){try{const r=await fetch(cloudBase()+"/iot_live/"+v.imei+".json");if(r.ok){const o=await r.json();if(o&&o.lat!=null)return{d:o,demo:false};}}catch(e){}}
  return{d:simState(v.imei,Date.now()),demo:true};
}
async function getPts(v,from,to){
  if(CLOUD.url){try{const r=await fetch(cloudBase()+"/iot_hist/"+v.imei+".json");if(r.ok){const o=await r.json();
    if(o){const a=Object.values(o).filter(x=>x&&x.t>=from&&x.t<=to).sort((x,y)=>x.t-y.t);if(a.length)return{a,demo:false};}}}catch(e){}}
  const end=Math.min(to,Date.now()),a=[];
  const step=Math.max(120000,Math.ceil((end-from)/4000/60000)*60000);
  for(let t=Math.ceil(from/step)*step;t<=end;t+=step)a.push(simState(v.imei,t));
  return{a,demo:true};
}

function hpSet(i){
  _hi=i;const p=_hp[i];if(!p||!_hm)return;
  _hm.setLatLng([p.lat,p.lng]);$("hpl").textContent=ts(new Date(p.t))+"  |  "+nz(p.speed," km/h")+"  |  IGN "+(p.ign?"ON":"OFF");$("hps").value=i;
}
function hpPlay(){
  clearInterval(window._td);
  if(window._hpOn){window._hpOn=false;$("hpb").textContent="▶ Play";return;}
  if(_hi>=_hp.length-1)hpSet(0);
  window._hpOn=true;$("hpb").textContent="⏸ Pause";const sp=+$("hpx").value;
  window._td=setInterval(()=>{
    if(_hi>=_hp.length-1){clearInterval(window._td);window._hpOn=false;if($("hpb"))$("hpb").textContent="▶ Play";return;}
    hpSet(Math.min(_hp.length-1,_hi+sp));},150);
}
async function doHist(){
  const v=vehs().find(x=>String(x.id)===val("h_v")),f=new Date($("h_f").value).getTime(),t=new Date($("h_t").value).getTime();
  if(!v)return flash("Select vehicle",0);
  if(!(f<t))return flash("Invalid date range (From must be before To)",0);
  if(t-f>31*864e5)return flash("Maximum 31 days at a time",0);
  flash("Loading…",1);
  const r=await getPts(v,f,t);if(!$("hres"))return;
  if(!r.a.length){$("hres").innerHTML="";return flash("No data found for this period",0);}
  $("msg").className="msg";$("msg").textContent="";
  window._hpOn=false;clearInterval(window._td);_hp=r.a;_hi=0;const s=calc(r.a);
  const c=(k,val,col)=>`<div class="c" style="border-color:${col}"><div class="k">${k}</div><div class="v">${val}</div></div>`;
  $("hres").innerHTML=`${r.demo?`<span class="demo" style="margin:0 0 10px">${DEMO_NOTE}</span>`:""}
<div class="ig">${c("Points",r.a.length,"#6366f1")}${c("Distance",s.d.toFixed(1)+" km","#06b6d4")}${c("Max Speed",s.mx+" km/h","#ef4444")}${c("Avg Speed",s.avg.toFixed(0)+" km/h","#f59e0b")}${c("Running (IGN ON)",fd(s.run),"#10b981")}${c("Stopped (IGN OFF)",fd(s.stop),"#64748b")}</div>
<div id="map" class="map" style="margin-top:12px"></div>
<div class="hp"><button id="hpb" class="b1" style="padding:8px 16px;border-radius:4px;cursor:pointer" onclick="hpPlay()">▶ Play</button>
<input id="hps" type="range" min="0" max="${r.a.length-1}" value="0" oninput="hpSet(+this.value)">
<select id="hpx" class="pgsel" onchange="if(window._hpOn){window._hpOn=false;hpPlay();}"><option value="1">1x</option><option value="3" selected>3x</option><option value="10">10x</option><option value="30">30x</option></select>
<span id="hpl" style="font-size:13px"></span></div>`;
  const m=newMap();if(!m)return;
  const ll=r.a.map(p=>[p.lat,p.lng]),poly=L.polyline(ll,{color:"#2563eb",weight:4,opacity:.85}).addTo(m);
  m.fitBounds(poly.getBounds().pad(.15));
  L.circleMarker(ll[0],{radius:8,color:"#fff",weight:2,fillColor:"#16a34a",fillOpacity:1}).addTo(m).bindTooltip("Start · "+ts(new Date(r.a[0].t)));
  L.circleMarker(ll[ll.length-1],{radius:8,color:"#fff",weight:2,fillColor:"#dc2626",fillOpacity:1}).addTo(m).bindTooltip("End · "+ts(new Date(r.a[r.a.length-1].t)));
  let n=0;for(let i=1;i<r.a.length&&n<200;i++){if(r.a[i-1].ign&&!r.a[i].ign){n++;L.circleMarker(ll[i],{radius:5,color:"#fff",weight:1,fillColor:"#f97316",fillOpacity:1}).addTo(m).bindTooltip("Ignition OFF · "+ts(new Date(r.a[i].t)));}}
  _hm=L.marker(ll[0],{icon:mkIcon(v.vtype,true),zIndexOffset:1000}).addTo(m);hpSet(0);
}

/* ---------- Reports ---------- */
let _rep={h:[],r:[],n:"report"};
function repPage(kind){
  const T={hist:["History Report",0],onoff:["Vehicle On/Off Report",0],sum:["Vehicle Summary Report",1]}[kind];
  const now=new Date(),st=new Date(now);st.setHours(0,0,0,0);if(kind==="sum")st.setDate(st.getDate()-6);
  _rep={h:[],r:[],n:kind+"_report"};
  return `<h1>Vehicle Tracking <small>» ${T[0]}</small></h1>
<div class="panel"><h3>${T[0]}</h3><div class="body fm">
<label>Vehicle</label>${vehSel("r_v",T[1])}
<label>From</label><input type="datetime-local" id="r_f" value="${dtl(st)}" style="max-width:260px">
<label>To</label><input type="datetime-local" id="r_t" value="${dtl(now)}" style="max-width:260px">
<div id="msg" class="msg"></div>
<div class="btns"><button class="b1" onclick="doRep('${kind}')">✔ SHOW REPORT</button><button class="b3" onclick="repExport()">⬇ EXPORT EXCEL</button></div></div></div>
<div class="panel" style="margin-top:18px"><h3 id="rtit">Result</h3><div id="rres"><div class="soon">Vehicle aur time select karke SHOW REPORT dabayein</div></div></div>`;
}
const repHist=()=>repPage("hist"),repOnOff=()=>repPage("onoff"),repSum=()=>repPage("sum");
async function doRep(kind){
  const sel=val("r_v"),f=new Date($("r_f").value).getTime(),t=new Date($("r_t").value).getTime();
  if(!sel)return flash("Select vehicle",0);
  if(!(f<t))return flash("Invalid date range (From must be before To)",0);
  if(t-f>31*864e5)return flash("Maximum 31 days at a time",0);
  const vs=sel==="all"?vehs():vehs().filter(x=>String(x.id)===sel);
  if(!vs.length)return flash("No vehicles available",0);
  flash("Loading…",1);
  let H=[],R=[],demo=false;
  const loc=p=>p.lat+", "+p.lng;
  if(kind==="hist")H=["SR. NO.","VEHICLE","IMEI","TIME","LATITUDE","LONGITUDE","SPEED (KM/H)","IGNITION","POWER (V)"];
  if(kind==="onoff")H=["SR. NO.","VEHICLE","IGNITION","START TIME","END TIME","DURATION","DISTANCE (KM)","START LOCATION","END LOCATION"];
  if(kind==="sum")H=["DATE","VEHICLE","IMEI","DISTANCE (KM)","MAX SPEED","AVG SPEED","RUNNING (IGN ON)","STOPPED (IGN OFF)","IGN ON COUNT","FIRST IGN ON","LAST IGN OFF"];
  for(const v of vs){
    const r=await getPts(v,f,t);demo=demo||r.demo;const a=r.a;if(!a.length)continue;
    if(kind==="hist")a.forEach((p,i)=>R.push([i+1,v.name,v.imei,ts(new Date(p.t)),p.lat,p.lng,nz(p.speed),p.ign?"ON":"OFF",nz(p.power)]));
    else if(kind==="onoff"){
      const seg=[];a.forEach(p=>{const l=seg[seg.length-1];if(l&&l.ign===!!p.ign){l.e=p;l.pts.push(p);}else seg.push({ign:!!p.ign,s:p,e:p,pts:[p]});});
      seg.forEach((g,i)=>{const end=seg[i+1]?seg[i+1].s:g.e;
        R.push([R.length+1,v.name,g.ign?"ON":"OFF",ts(new Date(g.s.t)),ts(new Date(end.t)),fd(end.t-g.s.t),calc(g.pts).d.toFixed(1),loc(g.s),loc(end)]);});
    }else{
      const days={};a.forEach(p=>{const k=ts(new Date(p.t)).slice(0,10);(days[k]=days[k]||[]).push(p);});
      Object.keys(days).sort().forEach(k=>{const s=calc(days[k]);R.push([k,v.name,v.imei,s.d.toFixed(1),s.mx,s.avg.toFixed(0),fd(s.run),fd(s.stop),s.on,s.first,s.last]);});
    }
  }
  if(!$("rres"))return;
  _rep={h:H,r:R,n:kind+"_report"};
  if(!R.length){$("rres").innerHTML=`<div class="soon">No data found for this period</div>`;return flash("No data found",0);}
  $("msg").className="msg";$("msg").textContent="";
  const show=R.slice(0,1000);
  $("rtit").innerHTML=`Result <small style="color:#64748b">(${R.length} rows)</small>${demo?`<span class="demo">${DEMO_NOTE}</span>`:""}`;
  $("rres").innerHTML=`<table><tr>${H.map(h=>`<th>${h}</th>`).join("")}</tr>${show.map(r=>`<tr>${r.map(c=>`<td>${esc(String(c))}</td>`).join("")}</tr>`).join("")}</table>${R.length>show.length?`<div class="pgbar"><span>Pehle 1000 rows dikh rahi hain – poora data Excel export me milega</span></div>`:""}`;
}
function repExport(){
  if(!_rep.r.length)return flash("Pehle SHOW REPORT dabayein, phir export karein",0);
  const rows=[_rep.h].concat(_rep.r),fn=_rep.n+"_"+ts().slice(0,10);
  if(window.XLSX){const ws=XLSX.utils.aoa_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Report");XLSX.writeFile(wb,fn+".xlsx");}
  else{const b=new Blob([rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n")],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=fn+".csv";a.click();}
}

/* ---------- 3D live PCB background (login) ---------- */
function pcb3d(){
  const host=$("pcb3d");if(!host||!window.THREE)return;
  let seed=7;const R=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const W=()=>host.clientWidth||innerWidth,H=()=>host.clientHeight||innerHeight;
  const r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.setSize(W(),H());host.appendChild(r.domElement);
  const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(42,W()/H(),.1,200);
  sc.add(new THREE.AmbientLight(0xaabbd8,1.35));
  const dl=new THREE.DirectionalLight(0xffffff,1.3);dl.position.set(6,14,8);sc.add(dl);
  const pl=new THREE.PointLight(0x22d3ee,1.4,50);pl.position.set(-8,5,5);sc.add(pl);
  const pl2=new THREE.PointLight(0xa855f7,1.1,50);pl2.position.set(9,4,-5);sc.add(pl2);
  const g=new THREE.Group();sc.add(g);
  const BW=24,BH=14;
  const board=new THREE.Mesh(new THREE.BoxGeometry(BW,.5,BH),new THREE.MeshPhongMaterial({color:0x0f8a55,shininess:70,specular:0x66aa88}));g.add(board);
  const gold=new THREE.MeshPhongMaterial({color:0xd8b24a,emissive:0x4a3a10,shininess:90});
  const bm=(w,h,d,mat,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);g.add(m);return m;};
  const paths=[];
  // traces
  for(let n=0;n<46;n++){
    let x=(R()-.5)*(BW-3),z=(R()-.5)*(BH-3),horiz=R()>.5;const p=[new THREE.Vector3(x,.3,z)];
    for(let s=0;s<4;s++){
      const L=(1.5+R()*5)*(R()>.5?1:-1);
      if(horiz)x=Math.max(-BW/2+1,Math.min(BW/2-1,x+L));else z=Math.max(-BH/2+1,Math.min(BH/2-1,z+L));
      const q=new THREE.Vector3(x,.3,z),a=p[p.length-1];
      if(a.distanceTo(q)>.2){
        const len=a.distanceTo(q),mid=a.clone().add(q).multiplyScalar(.5);
        bm(horiz?len+.1:.1,.05,horiz?.1:len+.1,gold,mid.x,.28,mid.z);p.push(q);
      }
      horiz=!horiz;
    }
    const end=p[p.length-1];const pad=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.06,14),gold);pad.position.set(end.x,.29,end.z);g.add(pad);
    if(p.length>1)paths.push(p);
  }
  // chips
  const black=new THREE.MeshPhongMaterial({color:0x1b2433,shininess:100,specular:0x6688aa});
  const pinM=new THREE.MeshPhongMaterial({color:0xcfd6df,shininess:80});
  function chip(x,z,w,d,h){
    bm(w,h,d,black,x,.25+h/2,z);
    bm(w*.25,.02,.25,new THREE.MeshBasicMaterial({color:0x334155}),x-w*.25,.27+h,z-d*.25);
    for(let i=0;i<Math.floor(w/.55);i++){const px=x-w/2+.35+i*.55;bm(.16,.06,.34,pinM,px,.3,z-d/2-.15);bm(.16,.06,.34,pinM,px,.3,z+d/2+.15);}
    for(let i=0;i<Math.floor(d/.55);i++){const pz=z-d/2+.35+i*.55;bm(.34,.06,.16,pinM,x-w/2-.15,.3,pz);bm(.34,.06,.16,pinM,x+w/2+.15,.3,pz);}
  }
  chip(-2,0,4,4,.5);chip(6.5,-2.5,2.6,2.6,.4);chip(-8,3,2.4,1.8,.35);chip(3,3.5,2,2,.35);chip(-7.5,-3.5,2.8,1.6,.35);
  // passives
  const resM=new THREE.MeshPhongMaterial({color:0x1f2937}),capM=new THREE.MeshPhongMaterial({color:0xb45309,shininess:60});
  for(let i=0;i<34;i++){const x=(R()-.5)*(BW-2),z=(R()-.5)*(BH-2);
    if(R()>.4){bm(.5,.18,.25,resM,x,.34,z);bm(.12,.2,.27,pinM,x-.25,.34,z);bm(.12,.2,.27,pinM,x+.25,.34,z);}
    else{const c=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.5,16),capM);c.position.set(x,.5,z);g.add(c);}}
  // LEDs
  const leds=[];[0x22d3ee,0x22c55e,0xf43f5e,0xfacc15,0xa855f7].forEach((c,i)=>{
    const m=new THREE.Mesh(new THREE.SphereGeometry(.2,12,12),new THREE.MeshBasicMaterial({color:c}));m.position.set(-10+i*.9,.5,5.5);g.add(m);leds.push(m);});
  // data pulses
  const pulses=paths.map((p,i)=>{
    const m=new THREE.Mesh(new THREE.SphereGeometry(.17,10,10),new THREE.MeshBasicMaterial({color:i%2?0x22d3ee:0xfde047}));g.add(m);
    const segs=[];let tot=0;for(let k=1;k<p.length;k++){const l=p[k].distanceTo(p[k-1]);segs.push(l);tot+=l;}
    return{m,p,segs,tot,t:R()*tot,sp:1.2+R()*2.2};});
  // grid glow floor
  const grid=new THREE.GridHelper(70,70,0x0ea5e9,0x1e3a8a);grid.position.y=-3;grid.material.opacity=.25;grid.material.transparent=true;sc.add(grid);
  g.rotation.x=.55;g.scale.set(1.8,1.8,1.8);
  function size(){r.setSize(W(),H());cam.aspect=W()/H();cam.updateProjectionMatrix();cam.position.set(0,W()/H()<1?30:18,W()/H()<1?40:25);cam.lookAt(0,0,0);}
  size();addEventListener("resize",size);
  const clk=new THREE.Clock();
  (function loop(){
    if($("login").classList.contains("hidden")){r.dispose();return;}
    requestAnimationFrame(loop);const t=clk.getElapsedTime(),dt=Math.min(clk.getDelta(),.05)||.016;
    g.rotation.y=Math.sin(t*.18)*.6;g.rotation.x=.5+Math.sin(t*.25)*.08;g.position.y=Math.sin(t*.6)*.25;
    pl.position.x=-8+Math.sin(t*.5)*6;pl2.position.z=-5+Math.cos(t*.4)*6;
    leds.forEach((l,i)=>{l.material.color.setScalar(1);l.scale.setScalar(.7+.5*Math.abs(Math.sin(t*2+i)));});
    pulses.forEach(o=>{o.t=(o.t+o.sp*.016)%o.tot;let d=o.t,k=0;while(k<o.segs.length-1&&d>o.segs[k]){d-=o.segs[k];k++;}
      o.m.position.lerpVectors(o.p[k],o.p[k+1],Math.min(1,d/o.segs[k]));o.m.position.y=.4;});
    r.render(sc,cam);
  })();
}

pcb3d();
if(sessionStorage.getItem("iot_auth"))start();
